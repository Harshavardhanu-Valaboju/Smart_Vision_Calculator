<!DOCTYPE html>

<html>

<head>

<title>Smart Vision Calculator</title>

<link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}">

</head>

<body>

<div class="container">

<h1>Smart Vision Calculator</h1>

<input type="file" id="imageInput">

<button onclick="uploadImage()">

Scan

</button>

<hr>

<h2>Detected Numbers</h2>

<div id="numbers"></div>

<hr>

<button onclick="calculate('+')">+</button>

<button onclick="calculate('-')">-</button>

<button onclick="calculate('*')">*</button>

<button onclick="calculate('/')">/</button>

<h2>Result</h2>

<h1 id="result">0</h1>

</div>

<script>

let selected=[];

async function uploadImage(){

const file=document.getElementById("imageInput").files[0];

if(!file){

alert("Select Image");

return;

}

const formData=new FormData();

formData.append("image",file);

const response=await fetch("/scan",{

method:"POST",

body:formData

});

const data=await response.json();

displayNumbers(data.numbers);

}

function displayNumbers(numbers){

selected=[];

const div=document.getElementById("numbers");

div.innerHTML="";

numbers.forEach(num=>{

const btn=document.createElement("button");

btn.innerText=num;

btn.className="number";

btn.onclick=()=>toggle(btn,num);

div.appendChild(btn);

});

}

function toggle(btn,num){

if(selected.includes(num)){

selected=selected.filter(n=>n!==num);

btn.classList.remove("selected");

}

else{

selected.push(num);

btn.classList.add("selected");

}

}

function calculate(op){

if(selected.length==0){

alert("Select numbers");

return;

}

let ans=Number(selected[0]);

for(let i=1;i<selected.length;i++){

let x=Number(selected[i]);

if(op=="+") ans+=x;

if(op=="-") ans-=x;

if(op=="*") ans*=x;

if(op=="/") ans/=x;

}

document.getElementById("result").innerHTML=ans;

}

</script>

</body>

</html>
